<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>男孩、鼴鼠、狐狸與馬｜心靈小旅程</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.7), transparent 30%),
        linear-gradient(180deg, #f3eee5 0%, #e9e1d5 100%);
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    color: #51483e;
}

/* =========================
   整個故事頁
========================= */

.page {
    width: 720px;
    max-width: 94%;
    min-height: 650px;
    margin: 28px auto;
    padding: 45px 42px;
    position: relative;

    background:
        linear-gradient(rgba(255,253,248,.96), rgba(255,253,248,.96)),
        #fffdf8;

    border-radius: 8px;

    box-shadow:
        0 12px 35px rgba(70,55,40,.10);

    overflow: hidden;
}

/* 淡淡的森林裝飾 */

.page::before {
    content: "🌿";
    position: absolute;
    top: 15px;
    left: 18px;
    font-size: 32px;
    opacity: .28;
    transform: rotate(-15deg);
}

.page::after {
    content: "🌿";
    position: absolute;
    right: 18px;
    bottom: 12px;
    font-size: 38px;
    opacity: .25;
    transform: rotate(20deg);
}


/* =========================
   標題
========================= */

.title {
    text-align: center;
    margin-bottom: 30px;
}

.title h1 {
    margin: 0;
    font-family:
        "Noto Serif TC",
        "Songti TC",
        "PMingLiU",
        serif;

    font-size: 27px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #51463b;
}

.title p {
    margin: 10px 0 0;
    font-size: 14px;
    letter-spacing: 1px;
    color: #9a8b7b;
}


/* =========================
   開始頁
========================= */

#startScreen {
    text-align: center;
}

.story-opening {
    margin: 25px auto 28px;
    max-width: 560px;

    font-family:
        "Noto Serif TC",
        "Songti TC",
        serif;

    font-size: 18px;
    line-height: 2.1;
    color: #615548;
}

.story-opening .small {
    font-size: 15px;
    color: #958576;
}

.forest-scene {
    position: relative;
    margin: 20px auto 28px;
    width: 100%;
    height: 150px;

    background:
        linear-gradient(
            180deg,
            #f5f0e7 0%,
            #f3eee4 65%,
            #e9dfd0 100%
        );

    border-radius: 80px 80px 25px 25px;
    overflow: hidden;
}

/* 遠方的樹 */

.tree {
    position: absolute;
    font-size: 55px;
    opacity: .55;
}

.tree.left {
    left: 8%;
    bottom: 27px;
}

.tree.right {
    right: 9%;
    bottom: 25px;
}

.tree.middle {
    left: 43%;
    bottom: 33px;
    font-size: 45px;
    opacity: .38;
}

/* 小路 */

.path {
    position: absolute;
    left: 28%;
    bottom: -10px;

    width: 44%;
    height: 70px;

    background: #d9c8ae;

    clip-path: polygon(
        42% 0,
        58% 0,
        100% 100%,
        0 100%
    );

    opacity: .7;
}

.walking-characters {
    position: absolute;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);

    font-size: 30px;
    letter-spacing: 4px;
}

.start-text {
    margin-bottom: 22px;
    font-family: "Noto Serif TC", serif;
    color: #77685a;
}

.start-btn {
    display: inline-block;

    padding: 13px 36px;

    background: #8c765f;
    color: white;

    border: none;
    border-radius: 30px;

    font-size: 16px;
    letter-spacing: 1px;

    cursor: pointer;

    box-shadow: 0 5px 12px rgba(80,60,40,.12);

    transition: .25s;
}

.start-btn:hover {
    background: #76604c;
    transform: translateY(-2px);
}


/* =========================
   測驗頁
========================= */

.quiz-container {
    display: none;
}

.journey-label {
    text-align: center;
    font-family: "Noto Serif TC", serif;
    font-size: 14px;
    color: #9a8876;
    margin-bottom: 10px;
}

/* 森林小路進度 */

.progress-area {
    position: relative;
    height: 34px;
    margin-bottom: 30px;
}

.progress-line {
    position: absolute;
    top: 15px;
    left: 4%;
    width: 92%;
    height: 2px;
    background: #ded2c3;
}

.progress-dot {
    position: absolute;
    top: 9px;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #c8b7a2;

    transition: .4s;
}

.dot1 { left: 3%; }
.dot2 { left: 34%; }
.dot3 { left: 65%; }
.dot4 { left: 95%; }

.progress-dot.active {
    background: #806a53;
    transform: scale(1.25);
}

.progress-dot.done {
    background: #a78e72;
}


/* =========================
   題目場景
========================= */

.scene-box {
    text-align: center;
    margin-bottom: 26px;
}

.scene-icon {
    font-size: 48px;
    margin-bottom: 10px;
}

.question-number {
    font-size: 13px;
    color: #a08f7d;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.question-title {
    font-family:
        "Noto Serif TC",
        "Songti TC",
        serif;

    font-size: 21px;
    line-height: 1.8;
    font-weight: 600;

    color: #4e4338;
}


/* =========================
   選項
========================= */

.options-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.option-item {
    position: relative;

    padding: 16px 20px;

    background: rgba(255,255,255,.75);

    border: 1px solid #e1d6c8;

    border-radius: 8px;

    font-family:
        "Noto Serif TC",
        "Microsoft JhengHei",
        serif;

    font-size: 16px;
    line-height: 1.65;

    cursor: pointer;

    transition: .25s;
}

.option-item::before {
    content: "○";
    margin-right: 10px;
    color: #b19d87;
}

.option-item:hover {
    background: #faf5ed;
    border-color: #aa957d;
    transform: translateX(3px);
}

.option-item.selected {
    background: #8c765f;
    color: white;
    border-color: #8c765f;
}

.option-item.selected::before {
    content: "●";
    color: white;
}


/* =========================
   結果前的揭曉
========================= */

.reveal-container {
    display: none;
    text-align: center;
    padding: 60px 20px;
}

.reveal-leaf {
    font-size: 42px;
    margin-bottom: 25px;
}

.reveal-text {
    font-family: "Noto Serif TC", serif;
    font-size: 18px;
    line-height: 2;
    color: #756658;
}

.reveal-main {
    margin-top: 30px;

    font-family: "Noto Serif TC", serif;

    font-size: 29px;
    font-weight: 600;

    color: #55483c;

    animation: fadeIn 1.2s ease;
}


/* =========================
   結果頁
========================= */

.result-container {
    display: none;
    text-align: center;
}

.result-top {
    font-family: "Noto Serif TC", serif;
    color: #9a8876;
    font-size: 15px;
    margin-bottom: 10px;
}

.result-card {
    padding: 25px 20px 30px;

    background:
        linear-gradient(
            180deg,
            rgba(250,246,238,.8),
            rgba(255,253,248,.9)
        );

    border-radius: 14px;

    border: 1px solid #e8dccd;

    position: relative;
}

.result-avatar {
    font-size: 80px;
    margin: 8px 0 10px;

    animation: float 2.5s ease-in-out infinite;
}

.result-role-small {
    font-family: "Noto Serif TC", serif;
    color: #9b8977;
    font-size: 15px;
    margin-bottom: 8px;
}

.result-role {
    font-family:
        "Noto Serif TC",
        "Songti TC",
        serif;

    font-size: 31px;
    font-weight: 600;

    color: #4d4136;

    margin-bottom: 10px;
}

.result-subtitle {
    font-size: 17px;
    color: #806d5b;
    margin-bottom: 20px;
}

.result-desc {
    max-width: 520px;
    margin: 0 auto;

    font-family:
        "Noto Serif TC",
        "Microsoft JhengHei",
        serif;

    font-size: 16px;
    line-height: 2;

    color: #625549;
}

.result-quote {
    max-width: 470px;
    margin: 23px auto 0;

    padding: 14px 20px;

    font-family: "Noto Serif TC", serif;

    font-size: 15px;
    line-height: 1.7;

    color: #796652;

    background: #fff;

    border-radius: 8px;
}


/* =========================
   特質分布
========================= */

.traits-panel {
    margin-top: 25px;

    padding: 20px;

    background: rgba(255,255,255,.65);

    border-top: 1px solid #e8ddd0;
    border-bottom: 1px solid #e8ddd0;
}

.traits-title {
    font-family: "Noto Serif TC", serif;
    font-size: 15px;
    color: #8d7c6b;
    margin-bottom: 18px;
}

.trait-row {
    margin-bottom: 13px;
}

.trait-label {
    display: flex;
    justify-content: space-between;

    font-size: 13px;
    color: #756658;

    margin-bottom: 5px;
}

.trait-track {
    height: 7px;

    background: #eee7dd;

    border-radius: 10px;

    overflow: hidden;
}

.trait-fill {
    height: 100%;

    background: #b29d86;

    border-radius: 10px;

    transition: width 1s ease;
}


/* =========================
   結果結尾
========================= */

.result-ending {
    margin: 27px auto;

    font-family: "Noto Serif TC", serif;

    font-size: 15px;
    line-height: 2;

    color: #867565;
}

.restart-btn {
    padding: 11px 28px;

    background: transparent;

    color: #806b57;

    border: 1px solid #bbaa96;

    border-radius: 25px;

    font-size: 14px;

    cursor: pointer;

    transition: .25s;
}

.restart-btn:hover {
    background: #f4eee5;
}


/* =========================
   動畫
========================= */

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* =========================
   手機版
========================= */

@media (max-width: 600px) {

    .page {
        margin: 12px auto;
        padding: 32px 20px;
        min-height: 650px;
    }

    .title h1 {
        font-size: 22px;
    }

    .story-opening {
        font-size: 16px;
    }

    .forest-scene {
        height: 125px;
    }

    .question-title {
        font-size: 19px;
    }

    .option-item {
        font-size: 15px;
        padding: 14px 15px;
    }

    .result-role {
        font-size: 27px;
    }

    .result-desc {
        font-size: 15px;
    }
}
</style>
</head>


<body>

<div class="page">

    <!-- =====================
         標題
    ====================== -->

    <div class="title">
        <h1>《男孩、鼴鼠、狐狸與馬》</h1>
        <p>一段關於友情、勇氣與溫柔的心靈小旅程</p>
    </div>


    <!-- =====================
         開始頁
    ====================== -->

    <div id="startScreen">

        <div class="story-opening">

            <div class="small">
                森林裡，有一條小路。
            </div>

            你不知道它會通往哪裡，<br>

            但也許，走著走著，<br>

            你會遇見一個朋友。<br>

            也會遇見一個……<br>

            <strong>更了解自己的機會。</strong>

        </div>


        <div class="forest-scene">

            <div class="tree left">🌳</div>
            <div class="tree middle">🌲</div>
            <div class="tree right">🌳</div>

            <div class="path"></div>

            <div class="walking-characters">
                👦 🐭 🦊 🐴
            </div>

        </div>


        <div class="start-text">
            沒有標準答案，跟著第一個直覺走就好。
        </div>


        <button class="start-btn" onclick="startQuiz()">
            沿著小路走 →
        </button>

    </div>


    <!-- =====================
         測驗
    ====================== -->

    <div id="quizScreen" class="quiz-container">

        <div id="journeyLabel" class="journey-label">
            第一段旅程
        </div>


        <div class="progress-area">

            <div class="progress-line"></div>

            <div class="progress-dot dot1 active"></div>
            <div class="progress-dot dot2"></div>
            <div class="progress-dot dot3"></div>
            <div class="progress-dot dot4"></div>

        </div>


        <div class="scene-box">

            <div id="sceneIcon" class="scene-icon">
                🌳
            </div>

            <div id="questionNumber" class="question-number">
                第一段旅程
            </div>

            <div id="questionTitle" class="question-title">
                故事載入中……
            </div>

        </div>


        <div id="optionsList" class="options-list"></div>

    </div>


    <!-- =====================
         揭曉頁
    ====================== -->

    <div id="revealScreen" class="reveal-container">

        <div class="reveal-leaf">
            🌿
        </div>

        <div class="reveal-text">

            你走過了森林裡的小路。<br>

            遇見了雨、朋友、難過與新的開始。<br>

            現在，讓我們看看——

        </div>

        <div class="reveal-main">
            原來，你最像的是……
        </div>

    </div>


    <!-- =====================
         結果
    ====================== -->

    <div id="resultScreen" class="result-container">

        <div class="result-top">
            這一路上，你遇見了自己
        </div>


        <div class="result-card">

            <div id="resultAvatar" class="result-avatar">
                🐴
            </div>

            <div class="result-role-small">
                原來，你是……
            </div>

            <div id="resultRole" class="result-role">
                馬
            </div>

            <div id="resultSubtitle" class="result-subtitle">
                溫柔的鼓勵者
            </div>

            <div id="resultDesc" class="result-desc">
                說明文字
            </div>

            <div id="resultQuote" class="result-quote">
                金句
            </div>

        </div>


        <div class="traits-panel">

            <div class="traits-title">
                🌱 你的旅程裡，也有這些朋友
            </div>

            <div id="traitsChart"></div>

        </div>


        <div class="result-ending">

            不管你是哪一個角色，<br>
            每一個人身上，都有一點男孩、鼴鼠、狐狸和馬。

        </div>


        <button class="restart-btn" onclick="resetQuiz()">
            再走一次小路
        </button>

    </div>

</div>


<script>

/* =====================================================
   四個角色
===================================================== */

const characters = {

    boy: {
        name: "男孩",
        icon: "👦",
        subtitle: "帶著好奇前進的人",

        desc:
        "你心中裝滿了對世界的好奇。面對未知或困難時，你喜歡問問看、試試看，也願意帶著身邊的人一起往前走。",

        quote:
        "「前面一定還有更多從沒見過的風景在等著我們！」"
    },


    mole: {
        name: "鼴鼠",
        icon: "🐭",
        subtitle: "坦誠而真實的人",

        desc:
        "你願意承認自己的害怕，也願意說出自己的感受。你知道，能夠坦白地說「我需要你」，並不是軟弱，而是一種勇敢。",

        quote:
        "「我有一點害怕，可以陪我一起嗎？」"
    },


    fox: {
        name: "狐狸",
        icon: "🦊",
        subtitle: "安靜的陪伴者",

        desc:
        "你不一定是最會說話的人，但你很懂得在重要的時候留下來。有些時候，不需要急著解決什麼，只要有人陪著，就已經很好了。",

        quote:
        "「我陪你，我就在這裡。」"
    },


    horse: {
        name: "馬",
        icon: "🐴",
        subtitle: "溫柔的鼓勵者",

        desc:
        "當身邊的人懷疑自己、害怕或受挫時，你總願意給他一點力量。你不替別人走路，而是讓他重新相信——自己可以繼續往前走。",

        quote:
        "「你已經做得很好了。」"
    }

};


/* =====================================================
   四個問題
===================================================== */

const questions = [

    {
        icon: "🌳",

        title:
        "森林裡很安靜。你看見朋友一個人坐在樹下，低著頭，看起來有一點失落。",

        options: [

            {
                text:
                "走過去坐到他身邊，安靜地陪著他。",
                role: "fox"
            },

            {
                text:
                "問他：「怎麼了？如果你想說，我可以聽。」",
                role: "mole"
            },

            {
                text:
                "輕拍他的肩膀：「沒關係，你已經很努力了。」",
                role: "horse"
            },

            {
                text:
                "邀請他：「要不要一起去前面的草地走走？」",
                role: "boy"
            }

        ]
    },


    {
        icon: "🌧️",

        title:
        "走到半路，天空突然下起大雨。你們身上都沒有雨具。",

        options: [

            {
                text:
                "四處看看：「那邊好像有屋簷，我們去看看！」",
                role: "boy"
            },

            {
                text:
                "把能遮雨的位置先讓給朋友。",
                role: "horse"
            },

            {
                text:
                "靠近朋友一點：「我其實有點害怕，我們一起走好嗎？」",
                role: "mole"
            },

            {
                text:
                "不慌張，和朋友一步一步找避雨的地方。",
                role: "fox"
            }

        ]
    },


    {
        icon: "📖",

        title:
        "你發現朋友不小心把一本你非常珍惜的故事書弄髒了。",

        options: [

            {
                text:
                "先關心他：「你是不是也嚇了一跳？別慌張。」",
                role: "horse"
            },

            {
                text:
                "告訴他：「這本書我很珍惜，我現在有一點難過。」",
                role: "mole"
            },

            {
                text:
                "拿面紙試著擦擦看：「我們一起看看能不能補救！」",
                role: "boy"
            },

            {
                text:
                "先陪他坐一下，等大家冷靜後再想辦法。",
                role: "fox"
            }

        ]
    },


    {
        icon: "🌅",

        title:
        "旅程到了尾聲。前面是一條新的路，你心裡最想說的是……",

        options: [

            {
                text:
                "「前面一定還有更多從沒見過的風景！」",
                role: "boy"
            },

            {
                text:
                "「今天能一起走過，我覺得很幸福。」",
                role: "mole"
            },

            {
                text:
                "「只要你需要，我的肩膀隨時可以讓你靠著。」",
                role: "horse"
            },

            {
                text:
                "什麼都不必說，只是微笑著並肩繼續走下去。",
                role: "fox"
            }

        ]
    }

];


/* =====================================================
   變數
===================================================== */

let currentIndex = 0;
let userPicks = [];


/* =====================================================
   開始
===================================================== */

function startQuiz() {

    currentIndex = 0;
    userPicks = [];

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("quizScreen").style.display = "block";

    renderQuestion();

}


/* =====================================================
   題目
===================================================== */

function renderQuestion() {

    const q = questions[currentIndex];

    const total = questions.length;


    /* 旅程文字 */

    const journeyNames = [
        "第一段旅程",
        "第二段旅程",
        "第三段旅程",
        "最後一段旅程"
    ];

    document.getElementById("journeyLabel").innerText =
        journeyNames[currentIndex];


    document.getElementById("questionNumber").innerText =
        journeyNames[currentIndex];


    /* 圖示 */

    document.getElementById("sceneIcon").innerText =
        q.icon;


    /* 題目 */

    document.getElementById("questionTitle").innerText =
        q.title;


    /* 更新進度點 */

    const dots = document.querySelectorAll(".progress-dot");

    dots.forEach((dot, index) => {

        dot.classList.remove("active");

        dot.classList.remove("done");

        if (index < currentIndex) {
            dot.classList.add("done");
        }

        if (index === currentIndex) {
            dot.classList.add("active");
        }

    });


    /* 選項 */

    const container =
        document.getElementById("optionsList");

    container.innerHTML = "";


    q.options.forEach(opt => {

        const div =
            document.createElement("div");

        div.className = "option-item";

        div.innerText = opt.text;


        div.onclick = () => {

            /* 防止連點 */

            if (div.classList.contains("selected")) {
                return;
            }


            div.classList.add("selected");

            userPicks.push(opt.role);


            setTimeout(() => {

                currentIndex++;


                if (currentIndex < total) {

                    renderQuestion();

                } else {

                    showReveal();

                }

            }, 500);

        };


        container.appendChild(div);

    });

}


/* =====================================================
   揭曉前動畫
===================================================== */

function showReveal() {

    document.getElementById("quizScreen").style.display = "none";

    document.getElementById("revealScreen").style.display = "block";


    setTimeout(() => {

        document.getElementById("revealScreen").style.display = "none";

        showResult();

    }, 2200);

}


/* =====================================================
   顯示結果
===================================================== */

function showResult() {

    document.getElementById("resultScreen").style.display = "block";


    /* 計算 */

    const counts = {
        boy: 0,
        mole: 0,
        fox: 0,
        horse: 0
    };


    userPicks.forEach(role => {

        counts[role]++;

    });


    /* 找最高分 */

    let primaryRole = "horse";

    let highest = -1;


    /*
       如果平手：

       boy → mole → fox → horse

       依照這個順序判斷
    */

    for (const role of ["boy", "mole", "fox", "horse"]) {

        if (counts[role] > highest) {

            highest = counts[role];

            primaryRole = role;

        }

    }


    const result = characters[primaryRole];


    /* 結果 */

    document.getElementById("resultAvatar").innerText =
        result.icon;


    document.getElementById("resultRole").innerText =
        result.name;


    document.getElementById("resultSubtitle").innerText =
        result.subtitle;


    document.getElementById("resultDesc").innerText =
        result.desc;


    document.getElementById("resultQuote").innerText =
        result.quote;


    /* 特質比例 */

    const chart =
        document.getElementById("traitsChart");

    chart.innerHTML = "";


    const totalAnswered =
        userPicks.length;


    for (const [key, character] of Object.entries(characters)) {

        const percent =
            Math.round(
                (counts[key] / totalAnswered) * 100
            );


        chart.innerHTML += `

            <div class="trait-row">

                <div class="trait-label">

                    <span>
                        ${character.icon}
                        ${character.name}
                    </span>

                    <span>
                        ${percent}%
                    </span>

                </div>


                <div class="trait-track">

                    <div
                        class="trait-fill"
                        style="width: ${percent}%">
                    </div>

                </div>

            </div>

        `;

    }

}


/* =====================================================
   重新開始
===================================================== */

function resetQuiz() {

    document.getElementById("resultScreen").style.display = "none";

    document.getElementById("startScreen").style.display = "block";

    currentIndex = 0;

    userPicks = [];

}

</script>
